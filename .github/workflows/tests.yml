name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ApexPost.sln
      - name: Build
        run: dotnet build ApexPost.sln --no-restore
      - name: Test (no SQL Server, no secrets, no network needed)
        run: dotnet test ApexPost.sln --no-build --logger "trx;LogFileName=results.trx"
