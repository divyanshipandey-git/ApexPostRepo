<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1130" width="1000" height="1130" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="1130" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">ApexPost test strategy at a glance</text>

  <!-- WHAT IS IT + FRAMEWORK -->
  <rect x="30" y="48" width="580" height="104" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="44" y="70" font-size="14" font-weight="700" fill="#92400e">What is a testing strategy?</text>
  <text x="44" y="92" font-size="13" fill="#78350f">A plan, made before writing tests, that answers four questions:</text>
  <text x="44" y="111" font-size="13" fill="#78350f">1. WHAT do we test? (the biggest risks first)   2. AT WHICH LEVEL? (unit,</text>
  <text x="44" y="128" font-size="13" fill="#78350f">integration or BDD)   3. WITH WHICH TOOL?   4. WHAT do we leave out?</text>
  <text x="44" y="146" font-size="13" font-weight="700" fill="#78350f">Simple answer: it is how we know a change is safe.</text>

  <rect x="630" y="48" width="340" height="104" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="70" font-size="14" font-weight="700" fill="#14532d">Which test framework? xUnit only</text>
  <text x="644" y="92" font-size="13" fill="#166534">All 8 test projects use xUnit.</text>
  <text x="644" y="110" font-size="13" fill="#166534">NUnit is not used anywhere.</text>
  <text x="644" y="128" font-size="12" fill="#166534">Moq (fakes) and Reqnroll (BDD)</text>
  <text x="644" y="145" font-size="12" fill="#166534">plug into xUnit, so one runner for all.</text>

  <text x="500" y="171" text-anchor="middle" font-size="13" fill="#4b5563">Boxes are the parts of the strategy. Arrows say how they relate. Read from the top down.</text>
  <g transform="translate(0,115)">

  <!-- ============ RELATIONSHIP LINES (drawn first, boxes on top) ============ -->
  <!-- Risk -> Strategy -->
  <line x1="250" y1="110" x2="388" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="268" y="98" width="102" height="18" fill="#ffffff"/>
  <text x="319" y="111" text-anchor="middle" font-size="11" fill="#374151">decides levels</text>
  <!-- Strategy -> App -->
  <line x1="610" y1="110" x2="748" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="98" width="42" height="18" fill="#ffffff"/>
  <text x="681" y="111" text-anchor="middle" font-size="11" fill="#374151">protects</text>
  <!-- Strategy -> three levels -->
  <path d="M500,165 V200 H180 V238" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500,165 V238" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500,165 V200 H820 V238" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="190" width="120" height="18" fill="#ffffff"/>
  <text x="500" y="203" text-anchor="middle" font-size="11" fill="#374151">splits into 3 levels</text>
  <!-- TDD -> Unit -->
  <line x1="125" y1="450" x2="125" y2="350" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="64" y="391" width="122" height="18" fill="#ffffff"/>
  <text x="125" y="404" text-anchor="middle" font-size="11" fill="#374151">written test-first for</text>
  <!-- Mocking -> Unit -->
  <line x1="300" y1="450" x2="300" y2="350" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="268" y="391" width="64" height="18" fill="#ffffff"/>
  <text x="300" y="404" text-anchor="middle" font-size="11" fill="#374151">isolates</text>
  <!-- Copilot -> BDD -->
  <line x1="835" y1="450" x2="835" y2="350" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="780" y="391" width="110" height="18" fill="#ffffff"/>
  <text x="835" y="404" text-anchor="middle" font-size="11" fill="#374151">drafts tests for</text>
  <!-- Integration -> CI -->
  <line x1="500" y1="350" x2="500" y2="570" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="452" width="120" height="18" fill="#ffffff"/>
  <text x="500" y="465" text-anchor="middle" font-size="11" fill="#374151">all 3 levels run by</text>

  <!-- ============ ROW 1 ============ -->
  <!-- RISK MAP -->
  <rect x="30" y="65" width="220" height="100" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="30" y="65" width="220" height="28" rx="6" fill="#d97706"/>
  <text x="140" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">RISK MAP</text>
  <text x="44" y="112" font-size="12" fill="#92400e">9 risks (R1 to R9)</text>
  <text x="44" y="130" font-size="12" fill="#92400e">wrong status move</text>
  <text x="44" y="146" font-size="12" fill="#92400e">duplicate scan or tracking no.</text>
  <text x="44" y="160" font-size="12" fill="#92400e">wrong role · bad network</text>

  <!-- STRATEGY -->
  <rect x="390" y="65" width="220" height="100" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="390" y="65" width="220" height="28" rx="6" fill="#1f2937"/>
  <text x="500" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TEST STRATEGY</text>
  <text x="404" y="112" font-size="12" fill="#1f2937">written first, before the tests</text>
  <text x="404" y="130" font-size="12" fill="#1f2937">cheapest level that catches</text>
  <text x="404" y="146" font-size="12" fill="#1f2937">each risk. Pyramid 81 / 12 / 7</text>
  <text x="404" y="160" font-size="11" fill="#6b7280">file: TESTING-STRATEGY.md</text>

  <!-- APP -->
  <rect x="750" y="65" width="220" height="100" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <rect x="750" y="65" width="220" height="28" rx="6" fill="#6b7280"/>
  <text x="860" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">APEXPOST APP</text>
  <text x="764" y="112" font-size="12" fill="#374151">API (rules, login, scans)</text>
  <text x="764" y="130" font-size="12" fill="#374151">SQL Server database</text>
  <text x="764" y="146" font-size="12" fill="#374151">courier client + offline store</text>
  <text x="764" y="160" font-size="11" fill="#6b7280">the thing we must not break</text>

  <!-- ============ ROW 2: THE THREE LEVELS ============ -->
  <!-- UNIT -->
  <rect x="30" y="240" width="300" height="110" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="240" width="300" height="28" rx="6" fill="#16a34a"/>
  <text x="180" y="259" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">UNIT TESTS · 779 · 81 %</text>
  <text x="44" y="286" font-size="12" font-weight="700" fill="#14532d">Is each rule right?</text>
  <text x="44" y="304" font-size="12" fill="#14532d">xUnit: Fact, Theory, InlineData</text>
  <text x="44" y="320" font-size="12" fill="#14532d">fast, one class, fakes for the rest</text>
  <text x="44" y="338" font-size="11" fill="#166534">e.g. Delivered can never go back</text>

  <!-- INTEGRATION -->
  <rect x="370" y="240" width="260" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="370" y="240" width="260" height="28" rx="6" fill="#2563eb"/>
  <text x="500" y="259" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">INTEGRATION · 115 · 12 %</text>
  <text x="384" y="286" font-size="12" font-weight="700" fill="#1e3a8a">Do the parts work together?</text>
  <text x="384" y="304" font-size="12" fill="#1e3a8a">real API + JWT, EF Core on SQLite</text>
  <text x="384" y="320" font-size="12" fill="#1e3a8a">no fakes, a few seconds</text>
  <text x="384" y="338" font-size="11" fill="#1d4ed8">e.g. Courier token gets 403</text>

  <!-- BDD -->
  <rect x="670" y="240" width="300" height="110" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="670" y="240" width="300" height="28" rx="6" fill="#7c3aed"/>
  <text x="820" y="259" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">BDD SPECS · 71 · 7 %</text>
  <text x="684" y="286" font-size="12" font-weight="700" fill="#4c1d95">What does the customer see?</text>
  <text x="684" y="304" font-size="12" fill="#4c1d95">Reqnroll: Given / When / Then</text>
  <text x="684" y="320" font-size="12" fill="#4c1d95">plain English, slowest, so fewest</text>
  <text x="684" y="338" font-size="11" fill="#6d28d9">e.g. a retried scan makes no duplicate</text>

  <!-- ============ ROW 3: HELPERS ============ -->
  <!-- TDD -->
  <rect x="30" y="452" width="200" height="98" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="30" y="452" width="200" height="26" rx="6" fill="#ea580c"/>
  <text x="130" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">TDD (technique)</text>
  <text x="42" y="498" font-size="12" fill="#9a3412">RED → GREEN → REFACTOR</text>
  <text x="42" y="516" font-size="12" fill="#9a3412">example: heavy parcel fee</text>
  <text x="42" y="534" font-size="11" fill="#c2410c">3 cycles, visible in git log</text>

  <!-- MOCKING -->
  <rect x="245" y="452" width="195" height="98" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="245" y="452" width="195" height="26" rx="6" fill="#0d9488"/>
  <text x="342" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MOCKING (Moq)</text>
  <text x="257" y="498" font-size="12" fill="#115e59">fake repository, fake uploader</text>
  <text x="257" y="516" font-size="12" fill="#115e59">proves the logic only,</text>
  <text x="257" y="534" font-size="12" fill="#115e59">not the real database</text>

  <!-- COPILOT -->
  <rect x="700" y="452" width="270" height="98" rx="6" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
  <rect x="700" y="452" width="270" height="26" rx="6" fill="#db2777"/>
  <text x="835" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GITHUB COPILOT (assistant)</text>
  <text x="712" y="498" font-size="12" fill="#9d174d">7 prompts, logged in COPILOT-LOG.md</text>
  <text x="712" y="516" font-size="12" fill="#9d174d">each draft reviewed: kept / changed</text>
  <text x="712" y="534" font-size="12" fill="#9d174d">/ rejected. Marked COPILOT-ASSISTED</text>

  <!-- ============ ROW 4: CI ============ -->
  <rect x="30" y="572" width="940" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="572" width="940" height="26" rx="6" fill="#14532d"/>
  <text x="500" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GITHUB ACTIONS (CI) · runs dotnet test on every push</text>
  <text x="500" y="619" text-anchor="middle" font-size="13" fill="#14532d">965 passed · 0 failed · red = stop and fix · green = safe to merge  (27 SQL Server tests skipped unless LocalDB is on; then 992 pass)</text>

  <text x="500" y="660" text-anchor="middle" font-size="13" fill="#374151">Read it as: Risks → Strategy → 3 levels → CI. TDD, Mocking and Copilot are helpers for the levels, not extra levels.</text>
  <text x="500" y="678" text-anchor="middle" font-size="11" fill="#6b7280">Proof the tests can fail: code was broken on purpose, tests went red, code restored, tests green (18 proofs in docs/evidence).</text>
  </g>

  <!-- WHERE ARE THE TESTS: project, level, count, framework -->
  <text x="30" y="808" font-size="15" font-weight="700" fill="#1f2937">Which folder holds how many tests (all passing, all xUnit)</text>
  <rect x="30" y="818" width="940" height="26" fill="#1f2937"/>
  <text x="44" y="836" font-size="12" font-weight="700" fill="#ffffff">Test project folder (under tests/)</text>
  <text x="440" y="836" font-size="12" font-weight="700" fill="#ffffff">Level</text>
  <text x="590" y="836" font-size="12" font-weight="700" fill="#ffffff">Tests</text>
  <text x="690" y="836" font-size="12" font-weight="700" fill="#ffffff">Framework / note</text>

  <rect x="30" y="844" width="940" height="24" fill="#dcfce7"/>
  <text x="44" y="861" font-size="12" fill="#14532d">ApexPost.UnitTests</text>
  <text x="440" y="861" font-size="12" fill="#14532d">Unit</text>
  <text x="590" y="861" font-size="12" font-weight="700" fill="#14532d">207</text>
  <text x="690" y="861" font-size="12" fill="#14532d">xUnit + Moq, TDD surcharge</text>
  <rect x="30" y="868" width="940" height="24" fill="#f0fdf4"/>
  <text x="44" y="885" font-size="12" fill="#14532d">ApexPost.Domain.Tests</text>
  <text x="440" y="885" font-size="12" fill="#14532d">Unit</text>
  <text x="590" y="885" font-size="12" font-weight="700" fill="#14532d">330</text>
  <text x="690" y="885" font-size="12" fill="#14532d">xUnit (rules, validation)</text>
  <rect x="30" y="892" width="940" height="24" fill="#dcfce7"/>
  <text x="44" y="909" font-size="12" fill="#14532d">ApexPost.Application.Tests</text>
  <text x="440" y="909" font-size="12" fill="#14532d">Unit</text>
  <text x="590" y="909" font-size="12" font-weight="700" fill="#14532d">168</text>
  <text x="690" y="909" font-size="12" fill="#14532d">xUnit + Moq (+22 SQL Server, opt-in)</text>
  <rect x="30" y="916" width="940" height="24" fill="#f0fdf4"/>
  <text x="44" y="933" font-size="12" fill="#14532d">ApexPost.Courier.Offline.Tests</text>
  <text x="440" y="933" font-size="12" fill="#14532d">Unit</text>
  <text x="590" y="933" font-size="12" font-weight="700" fill="#14532d">53</text>
  <text x="690" y="933" font-size="12" fill="#14532d">xUnit (offline store, outbox)</text>
  <rect x="30" y="940" width="940" height="24" fill="#dcfce7"/>
  <text x="44" y="957" font-size="12" fill="#14532d">ApexPost.Api.Tests</text>
  <text x="440" y="957" font-size="12" fill="#14532d">Unit</text>
  <text x="590" y="957" font-size="12" font-weight="700" fill="#14532d">21</text>
  <text x="690" y="957" font-size="12" fill="#14532d">xUnit (API classes)</text>
  <rect x="30" y="964" width="940" height="26" fill="#86efac"/>
  <text x="44" y="982" font-size="12" font-weight="700" fill="#14532d">Unit subtotal</text>
  <text x="590" y="982" font-size="13" font-weight="700" fill="#14532d">779</text>
  <text x="690" y="982" font-size="12" font-weight="700" fill="#14532d">about 81 %</text>

  <rect x="30" y="990" width="940" height="24" fill="#dbeafe"/>
  <text x="44" y="1007" font-size="12" fill="#1e3a8a">ApexPost.IntegrationTests</text>
  <text x="440" y="1007" font-size="12" fill="#1e3a8a">Integration</text>
  <text x="590" y="1007" font-size="12" font-weight="700" fill="#1e3a8a">39</text>
  <text x="690" y="1007" font-size="12" fill="#1e3a8a">xUnit, real API + SQLite</text>
  <rect x="30" y="1014" width="940" height="24" fill="#eff6ff"/>
  <text x="44" y="1031" font-size="12" fill="#1e3a8a">ApexPost.Web.IntegrationTests</text>
  <text x="440" y="1031" font-size="12" fill="#1e3a8a">Integration</text>
  <text x="590" y="1031" font-size="12" font-weight="700" fill="#1e3a8a">76</text>
  <text x="690" y="1031" font-size="12" fill="#1e3a8a">xUnit (+5 skipped), MVC pipeline</text>
  <rect x="30" y="1038" width="940" height="26" fill="#93c5fd"/>
  <text x="44" y="1056" font-size="12" font-weight="700" fill="#1e3a8a">Integration subtotal</text>
  <text x="590" y="1056" font-size="13" font-weight="700" fill="#1e3a8a">115</text>
  <text x="690" y="1056" font-size="12" font-weight="700" fill="#1e3a8a">about 12 %</text>

  <rect x="30" y="1064" width="940" height="26" fill="#ede9fe"/>
  <text x="44" y="1082" font-size="12" fill="#4c1d95">ApexPost.Specs (8 .feature files)</text>
  <text x="440" y="1082" font-size="12" fill="#4c1d95">BDD</text>
  <text x="590" y="1082" font-size="13" font-weight="700" fill="#4c1d95">71</text>
  <text x="690" y="1082" font-size="12" fill="#4c1d95">Reqnroll on xUnit, about 7 %</text>

  <rect x="30" y="1090" width="940" height="30" fill="#1f2937"/>
  <text x="44" y="1110" font-size="13" font-weight="700" fill="#ffffff">TOTAL (8 projects)</text>
  <text x="590" y="1110" font-size="14" font-weight="700" fill="#ffffff">965</text>
  <text x="690" y="1110" font-size="12" font-weight="700" fill="#ffffff">passed · 0 failed · 27 skipped</text>
</svg>
